<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Worksheet 4 — Part 4 (Phong Shaded Sphere)</title>
  <script src="MV.js"></script>

  <script id="wgsl" type="x-shader">
    struct Uniforms {
      mvp: mat4x4f,
      model: mat4x4f,
      eye: vec4f,
      lightDir: vec4f,
      material: vec4f,
      lighting: vec4f,
    };
    @group(0) @binding(0) var<uniform> U : Uniforms;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) color : vec3f,
    };

    const diffuseColor  = vec3f(0.68, 0.58, 0.86);
    const specularColor = vec3f(0.95, 0.95, 1.0);

    @vertex
    fn main_vs(@location(0) inPos : vec3f) -> VSOut {
      var out : VSOut;
      let posWorld = (U.model * vec4f(inPos, 1.0)).xyz;
      let n        = normalize((U.model * vec4f(inPos, 0.0)).xyz);

      let w_i = normalize(U.lightDir.xyz);
      let w_o = normalize(U.eye.xyz - posWorld);

      let kd = U.material.x;
      let ks = U.material.y;
      let s  = U.material.z;
      let Le = U.lighting.x;
      let La = U.lighting.y;

      let cos_t = max(dot(n, w_i), 0.0);
      let ambient = diffuseColor * kd * La;
      let diffuse = diffuseColor * kd * Le * cos_t;
      var specular = vec3f(0.0);
      if (cos_t > 0.0) {
        let w_r = 2.0 * dot(w_i, n) * n - w_i;
        specular = specularColor * ks * Le * pow(max(dot(w_r, w_o), 0.0), s);
      }

      out.color = ambient + diffuse + specular;
      out.clip = U.mvp * vec4f(inPos, 1.0);
      return out;
    }

    @fragment
    fn main_fs(@location(0) color : vec3f) -> @location(0) vec4f {
      return vec4f(color, 1.0);
    }
</script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #eef2ff;
      color: #1e1b4b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    #my-canvas {
      width: 800px;
      height: 600px;
      border: 1px solid #c7d2fe;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(30, 27, 75, 0.18);
    }
    #top-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    #top-bar button {
      padding: 0.35rem 0.9rem;
      border: 1px solid #a5b4fc;
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    #top-bar button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #top-bar span {
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    #sliders {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
      width: min(800px, 90vw);
    }
    .slider {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      background: #ffffff;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #d4d4f7;
      box-shadow: 0 6px 18px rgba(30, 27, 75, 0.08);
    }
    .slider label {
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slider input[type="range"] {
      width: 100%;
    }
    .value {
      font-variant-numeric: tabular-nums;
    }
  </style>

  <script src="Worksheet4-4.js" defer></script>
</head>
<body>
  <main>
    <canvas id="my-canvas" width="1000" height="750">WebGPU not supported.</canvas>
    <div id="top-bar">
      <button id="subdiv-dec">Subdivide −</button>
      <span id="subdiv-label">Subdivision Level: 0</span>
      <button id="subdiv-inc">Subdivide +</button>
    </div>
    <section id="sliders">
      <div class="slider">
        <label>k<sub>d</sub>: <span class="value" id="kd-value">0.80</span></label>
        <input id="kd-slider" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>
      <div class="slider">
        <label>k<sub>s</sub>: <span class="value" id="ks-value">0.40</span></label>
        <input id="ks-slider" type="range" min="0" max="1" step="0.01" value="0.4" />
      </div>
      <div class="slider">
        <label>s (shininess): <span class="value" id="s-value">32</span></label>
        <input id="s-slider" type="range" min="1" max="128" step="1" value="32" />
      </div>
      <div class="slider">
        <label>L<sub>e</sub>: <span class="value" id="le-value">1.00</span></label>
        <input id="le-slider" type="range" min="0" max="2" step="0.01" value="1.0" />
      </div>
      <div class="slider">
        <label>L<sub>a</sub>: <span class="value" id="la-value">0.20</span></label>
        <input id="la-slider" type="range" min="0" max="1" step="0.01" value="0.2" />
      </div>
    </section>
  </main>
</body>
</html>
