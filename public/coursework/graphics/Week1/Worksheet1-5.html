<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bouncing Circle</title>
  <script type="text/javascript" src="MV.js"></script>

  <script id="wgsl" type="x-shader">
  struct Uniforms {
    center: vec2f,
    radius: f32,
    _pad:   f32,
  };
  struct VSOut {
    @builtin(position) position: vec4f,
  };

  @group(0) @binding(0) var<uniform> U: Uniforms;

  @vertex
  fn main_vs(@location(0) inPos: vec2f) -> VSOut {
    let p = U.center + inPos * U.radius;
    var out: VSOut;
    out.position = vec4f(p, 0.0, 1.0);
    return out;
  }

  @fragment
  fn main_fs() -> @location(0) vec4f {
    return vec4f(1.0, 1.0, 1.0, 1.0);
  }
  </script>

  <script type="text/javascript" src="Worksheet1-5.js" defer></script>
</head>
<body>
  <canvas id="my-canvas" width="512" height="512">
    Please use a browser that supports HTML5 canvas.
  </canvas>
</body>
</html>
