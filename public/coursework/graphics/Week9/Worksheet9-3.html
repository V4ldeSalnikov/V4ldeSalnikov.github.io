<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Worksheet 9 — Parts 3-4 (Shadow mapping)</title>
  <script src="MV.js"></script>
  <script src="OBJParser.js"></script>

  <script id="depth-wgsl" type="x-shader">
    struct Uniforms { lightMVP : mat4x4f, };
    @group(0) @binding(0) var<uniform> U : Uniforms;

    @vertex
    fn main_vs_depth(@location(0) inPos : vec3f) -> @builtin(position) vec4f {
      return U.lightMVP * vec4f(inPos, 1.0);
    }

    @fragment
    fn main_fs_depth(@builtin(position) fragcoord : vec4f) -> @location(0) vec4f {
      return vec4f(vec3f(fragcoord.z), 1.0);
    }
</script>

  <script id="teapot-wgsl" type="x-shader">
    struct Uniforms {
      mvp           : mat4x4f,
      model         : mat4x4f,
      lightViewProj : mat4x4f,
      lightPos      : vec4f,
      eye           : vec4f,
    };
    @group(0) @binding(0) var<uniform> U : Uniforms;
    @group(0) @binding(1) var shadowMap : texture_2d<f32>;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) worldPos : vec3f,
      @location(1) normal   : vec3f,
      @location(2) color    : vec3f,
    };

    @vertex
    fn main_vs(@location(0) inPos : vec3f, @location(1) inNormal : vec3f, @location(2) inColor : vec3f) -> VSOut {
      var out : VSOut;
      out.clip     = U.mvp * vec4f(inPos, 1.0);
      out.worldPos = (U.model * vec4f(inPos, 1.0)).xyz;
      out.normal   = (U.model * vec4f(inNormal, 0.0)).xyz;
      out.color    = inColor;
      return out;
    }

    fn lightVisibility(worldPos : vec3f) -> f32 {
      let clip = U.lightViewProj * vec4f(worldPos, 1.0);
      let s = clip.xyz / clip.w;
      let coords = vec3f(s.x * 0.5 + 0.5, s.y * -0.5 + 0.5, s.z);
      if (coords.x < 0.0 || coords.x > 1.0 || coords.y < 0.0 || coords.y > 1.0) {
        return 1.0;
      }
      let dim = vec2f(textureDimensions(shadowMap));
      let texel = vec2u(coords.xy * dim);
      let depth = textureLoad(shadowMap, texel, 0).r;
      return select(1.0, 0.0, depth < coords.z - 0.003);
    }

    @fragment
    fn main_fs(in : VSOut) -> @location(0) vec4f {
      let N = normalize(in.normal);
      let L = normalize(U.lightPos.xyz - in.worldPos);
      let V = normalize(U.eye.xyz - in.worldPos);
      let R = reflect(-L, N);

      let kd = 0.9; let ks = 0.3; let s = 32.0; let La = 0.25; let Le = 0.9;
      let ambient  = in.color * kd * La;
      let diffuse  = in.color * kd * Le * max(dot(N, L), 0.0);
      let specular = vec3f(ks * Le * pow(max(dot(R, V), 0.0), s));

      let visibility = lightVisibility(in.worldPos);
      return vec4f(ambient + visibility * (diffuse + specular), 1.0);
    }
</script>

  <script id="ground-wgsl" type="x-shader">
    struct Uniforms {
      mvp           : mat4x4f,
      lightViewProj : mat4x4f,
      lightPos      : vec4f,
    };
    @group(0) @binding(0) var<uniform> U : Uniforms;
    @group(0) @binding(1) var samp : sampler;
    @group(0) @binding(2) var groundTex : texture_2d<f32>;
    @group(0) @binding(3) var shadowMap : texture_2d<f32>;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) worldPos : vec3f,
      @location(1) uv : vec2f,
    };

    @vertex
    fn main_vs(@location(0) inPos : vec3f, @location(1) inUV : vec2f) -> VSOut {
      var out : VSOut;
      out.clip = U.mvp * vec4f(inPos, 1.0);
      out.worldPos = inPos;
      out.uv = inUV;
      return out;
    }

    fn lightVisibility(worldPos : vec3f) -> f32 {
      let clip = U.lightViewProj * vec4f(worldPos, 1.0);
      let s = clip.xyz / clip.w;
      let coords = vec3f(s.x * 0.5 + 0.5, s.y * -0.5 + 0.5, s.z);
      if (coords.x < 0.0 || coords.x > 1.0 || coords.y < 0.0 || coords.y > 1.0) {
        return 1.0;
      }
      let dim = vec2f(textureDimensions(shadowMap));
      let texel = vec2u(coords.xy * dim);
      let depth = textureLoad(shadowMap, texel, 0).r;
      return select(1.0, 0.0, depth < coords.z - 0.003);
    }

    @fragment
    fn main_fs(in : VSOut) -> @location(0) vec4f {
      let base = textureSample(groundTex, samp, in.uv).rgb;
      let N = vec3f(0.0, 1.0, 0.0);
      let L = normalize(U.lightPos.xyz - in.worldPos);

      let kd = 1.0; let La = 0.3; let Le = 0.9;
      let ambient = base * kd * La;
      let diffuse = base * kd * Le * max(dot(N, L), 0.0);
      let visibility = lightVisibility(in.worldPos);
      return vec4f(ambient + visibility * diffuse, 1.0);
    }
</script>

  <script id="debug-wgsl" type="x-shader">
    @group(0) @binding(0) var shadowMap : texture_2d<f32>;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) uv : vec2f,
    };

    @vertex
    fn main_vs(@builtin(vertex_index) vi : u32) -> VSOut {
      let pos = array<vec2f, 6>(
        vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0),
        vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0)
      );
      let uv = array<vec2f, 6>(
        vec2f(0.0, 1.0), vec2f(1.0, 1.0), vec2f(1.0, 0.0),
        vec2f(0.0, 1.0), vec2f(1.0, 0.0), vec2f(0.0, 0.0)
      );
      var out : VSOut;
      out.clip = vec4f(pos[vi], 0.0, 1.0);
      out.uv = uv[vi];
      return out;
    }

    @fragment
    fn main_fs(in : VSOut) -> @location(0) vec4f {
      let dim = vec2f(textureDimensions(shadowMap));
      let depth = textureLoad(shadowMap, vec2u(in.uv * dim), 0).r;
      let v = clamp((1.0 - depth) * 8.0, 0.0, 1.0);
      return vec4f(vec3f(v), 1.0);
    }
</script>
