<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Worksheet 9 — Part 2 (Projection shadows for reference)</title>
  <script src="MV.js"></script>
  <script src="OBJParser.js"></script>

  <script id="teapot-wgsl" type="x-shader">
    struct Uniforms {
      mvp      : mat4x4f,
      model    : mat4x4f,
      lightPos : vec4f,
      eye      : vec4f,
    };
    @group(0) @binding(0) var<uniform> U : Uniforms;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) worldPos : vec3f,
      @location(1) normal   : vec3f,
      @location(2) color    : vec3f,
    };

    @vertex
    fn main_vs(@location(0) inPos : vec3f, @location(1) inNormal : vec3f, @location(2) inColor : vec3f) -> VSOut {
      var out : VSOut;
      out.clip     = U.mvp * vec4f(inPos, 1.0);
      out.worldPos = (U.model * vec4f(inPos, 1.0)).xyz;
      out.normal   = (U.model * vec4f(inNormal, 0.0)).xyz;
      out.color    = inColor;
      return out;
    }

    @fragment
    fn main_fs(in : VSOut) -> @location(0) vec4f {
      let N = normalize(in.normal);
      let L = normalize(U.lightPos.xyz - in.worldPos);
      let V = normalize(U.eye.xyz - in.worldPos);
      let R = reflect(-L, N);

      let kd = 0.9; let ks = 0.3; let s = 32.0; let La = 0.25; let Le = 0.9;
      let ambient  = in.color * kd * La;
      let diffuse  = in.color * kd * Le * max(dot(N, L), 0.0);
      let specular = vec3f(ks * Le * pow(max(dot(R, V), 0.0), s));
      return vec4f(ambient + diffuse + specular, 1.0);
    }
</script>

  <script id="ground-wgsl" type="x-shader">
    struct Uniforms { mvp : mat4x4f, };
    @group(0) @binding(0) var<uniform> U : Uniforms;
    @group(0) @binding(1) var samp : sampler;
    @group(0) @binding(2) var tex : texture_2d<f32>;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) uv : vec2f,
    };

    @vertex
    fn main_vs(@location(0) inPos : vec3f, @location(1) inUV : vec2f) -> VSOut {
      var out : VSOut;
      out.clip = U.mvp * vec4f(inPos, 1.0);
      out.uv = inUV;
      return out;
    }

    @fragment
    fn main_fs(@location(0) uv : vec2f) -> @location(0) vec4f {
      return textureSample(tex, samp, uv);
    }
</script>

  <script id="shadow-wgsl" type="x-shader">
    struct Uniforms { mvp : mat4x4f, };
    @group(0) @binding(0) var<uniform> U : Uniforms;

    @vertex
    fn main_vs(@location(0) inPos : vec3f, @location(1) inNormal : vec3f, @location(2) inColor : vec3f) -> @builtin(position) vec4f {
      return U.mvp * vec4f(inPos, 1.0);
    }

    @fragment
    fn main_fs() -> @location(0) vec4f {
      return vec4f(0.0, 0.0, 0.0, 1.0);
    }
</script>

    }
    button:hover { background: #e5e7eb; }
    #status { color: #cbd5e1; font-size: 0.95rem; min-width: 15rem; text-align: right; }
  </style>
