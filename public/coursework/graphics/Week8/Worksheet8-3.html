<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Worksheet 8 — Part 3 (Shadow culling with the depth test)</title>
  <script src="MV.js"></script>

  <script id="wgsl" type="x-shader">
    struct Uniforms {
      mvp        : mat4x4f,
      visibility : f32,
    };
    @group(0) @binding(0) var<uniform> U : Uniforms;
    @group(0) @binding(1) var samp : sampler;
    @group(0) @binding(2) var tex : texture_2d<f32>;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) uv : vec2f,
    };

    @vertex
    fn main_vs(@location(0) inPos : vec3f, @location(1) inUV : vec2f) -> VSOut {
      var out : VSOut;
      out.clip = U.mvp * vec4f(inPos, 1.0);
      out.uv = inUV;
      return out;
    }

    @fragment
    fn main_fs(@location(0) uv : vec2f) -> @location(0) vec4f {
      let color = textureSample(tex, samp, uv);
      return vec4f(color.rgb * U.visibility, 1.0);
    }
</script>

    }

  <script src="Worksheet8-3.js" defer></script>
