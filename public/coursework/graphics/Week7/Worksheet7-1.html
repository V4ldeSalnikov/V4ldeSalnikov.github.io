<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Worksheet 7 — Part 1 (Cube Map Sphere)</title>
  <script src="MV.js"></script>

  <script id="wgsl" type="x-shader">
    struct Uniforms {
      mvp : mat4x4f,
    };
    @group(0) @binding(0) var<uniform> U : Uniforms;
    @group(0) @binding(1) var samp : sampler;
    @group(0) @binding(2) var cubeTex : texture_cube<f32>;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) normal : vec3f,
    };

    @vertex
    fn main_vs(@location(0) inPos : vec3f) -> VSOut {
      var out : VSOut;
      out.clip = U.mvp * vec4f(inPos, 1.0);
      out.normal = inPos;
      return out;
    }

    @fragment
    fn main_fs(@location(0) normal : vec3f) -> @location(0) vec4f {
      let d = normalize(normal);
      return vec4f(textureSample(cubeTex, samp, vec3f(d.x, -d.y, d.z)).rgb, 1.0);
    }
</script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at 20% 20%, #0b1a32, #050910 45%);
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { display: grid; place-items: center; }
    main { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
    h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: 0.02em; margin: 0.25rem 0 0; }
    #my-canvas {
      width: 860px;
      height: 640px;
      border: 1px solid #1e3a8a;
      background: #0b1224;
      box-shadow: 0 18px 46px rgba(2, 8, 20, 0.55);
      cursor: grab;
    }
    #hint { max-width: 880px; color: #a5b4fc; font-size: 0.94rem; text-align: center; line-height: 1.55; }
  </style>

  <script src="Worksheet7-1.js" defer></script>
</head>
<body>
  <main>
    <h1>Worksheet 7 — Part 1 · Cube Map Environment</h1>
    <canvas id="my-canvas" width="1000" height="750">WebGPU not supported.</canvas>
    <p id="hint">The sphere is textured by a cube map, looked up with the surface normal (no inverse mapping, no shading). Drag to orbit.</p>
  </main>
</body>
</html>
