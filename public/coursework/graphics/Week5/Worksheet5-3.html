<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Worksheet 5 — Part 3 (Teapot OBJ Loading)</title>
  <script src="MV.js"></script>
  <script src="OBJParser.js"></script>

  <script id="wgsl" type="x-shader">
    struct Uniforms {
      mvp: mat4x4f,
    };
    @group(0) @binding(0) var<uniform> U : Uniforms;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) normal : vec3f,
    };

    @vertex
    fn main_vs(@location(0) inPos : vec3f, @location(1) inNormal : vec3f) -> VSOut {
      var out : VSOut;
      out.clip = U.mvp * vec4f(inPos, 1.0);
      out.normal = inNormal;
      return out;
    }

    @fragment
    fn main_fs(@location(0) normal : vec3f) -> @location(0) vec4f {
      return vec4f(0.5 * normalize(normal) + vec3f(0.5), 1.0);
    }
</script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ede9fe;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    #my-canvas {
      width: 800px;
      height: 600px;
      border: 1px solid #c4b5fd;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(79, 70, 229, 0.16);
    }
    #status {
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 0.5rem 1rem;
      background: #ddd6fe;
      border-radius: 6px;
      color: #5b21b6;
    }
  </style>

  <script src="Worksheet5-3.js" defer></script>
</head>
<body>
  <main>
    <canvas id="my-canvas" width="1000" height="750">WebGPU not supported.</canvas>
    <div id="status">Loading teapot...</div>
  </main>
</body>
</html>
