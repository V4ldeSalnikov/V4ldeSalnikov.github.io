<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Worksheet 10 — Part 2 (Quaternion trackball orbiting)</title>
  <script src="MV.js"></script>
  <script src="quaternion.js"></script>
  <script src="OBJParser.js"></script>

  <script id="wgsl" type="x-shader">
    struct Uniforms {
      mvp      : mat4x4f,
      model    : mat4x4f,
      lightDir : vec4f,
      eye      : vec4f,
    };
    @group(0) @binding(0) var<uniform> U : Uniforms;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) worldPos : vec3f,
      @location(1) normal   : vec3f,
      @location(2) color    : vec3f,
    };

    @vertex
    fn main_vs(@location(0) inPos : vec3f, @location(1) inNormal : vec3f, @location(2) inColor : vec3f) -> VSOut {
      var out : VSOut;
      out.clip     = U.mvp * vec4f(inPos, 1.0);
      out.worldPos = (U.model * vec4f(inPos, 1.0)).xyz;
      out.normal   = (U.model * vec4f(inNormal, 0.0)).xyz;
      out.color    = inColor;
      return out;
    }

    @fragment
    fn main_fs(in : VSOut) -> @location(0) vec4f {
      let N = normalize(in.normal);
      let L = normalize(U.lightDir.xyz);
      let V = normalize(U.eye.xyz - in.worldPos);
      let R = reflect(-L, N);
      let kd = 0.9; let ks = 0.3; let s = 32.0; let La = 0.25; let Le = 0.9;
      let ambient  = in.color * kd * La;
      let diffuse  = in.color * kd * Le * max(dot(N, L), 0.0);
      let specular = vec3f(ks * Le * pow(max(dot(R, V), 0.0), s));
      return vec4f(ambient + diffuse + specular, 1.0);
    }
</script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #20242b;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { display: grid; place-items: center; padding: 1rem; box-sizing: border-box; }
    main { display: flex; flex-direction: column; gap: 0.75rem; align-items: center; }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 650; }
    #my-canvas {
      width: min(900px, calc(100vw - 2rem));
      aspect-ratio: 4 / 3;
      height: auto;
      border: 1px solid #6b7280;
      background: #0f172a;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
      cursor: grab;
      touch-action: none;
    }
    #hint { color: #cbd5e1; font-size: 0.95rem; }
  </style>

  <script src="Worksheet10-2.js" defer></script>
</head>
<body>
  <main>
    <h1>Worksheet 10 — Part 2 · Quaternion trackball orbiting</h1>
    <canvas id="my-canvas" width="900" height="675">WebGPU not supported.</canvas>
    <p id="hint">Drag to orbit. The rotation uses quaternions (no gimbal lock).</p>
  </main>
</body>
</html>
