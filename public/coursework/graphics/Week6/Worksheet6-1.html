<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Worksheet 6 — Part 1 (Checkerboard Rectangle)</title>
  <script src="MV.js"></script>

  <script id="wgsl" type="x-shader">
    struct Uniforms {
      mvp : mat4x4<f32>,
    };
    @group(0) @binding(0) var<uniform> U : Uniforms;
    @group(0) @binding(1) var samp : sampler;
    @group(0) @binding(2) var tex : texture_2d<f32>;

    struct VSOut {
      @builtin(position) clip : vec4f,
      @location(0) uv : vec2f,
    };

    @vertex
    fn main_vs(
      @location(0) inPos : vec3f,
      @location(1) inUV : vec2f
    ) -> VSOut {
      var out : VSOut;
      out.clip = U.mvp * vec4f(inPos, 1.0);
      out.uv = inUV;
      return out;
    }

    @fragment
    fn main_fs(@location(0) uv : vec2f) -> @location(0) vec4f {
      return textureSample(tex, samp, uv);
    }
</script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0b1c3d;

      background: #2563eb;
      box-shadow: 0 18px 40px rgba(11, 17, 32, 0.45);
    }
  </style>

  <script src="Worksheet6-1.js" defer></script>
</head>

</body>
