<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>W05P3 – Smooth shading (interpolated normals)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script defer src="../Week1/MV.js"></script>
  <script defer src="OBJParser.js"></script>
  <script defer src="Worksheet5-3.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #181818; }
    canvas { display: block; margin: auto; }
  </style>
</head>
<body>
  <canvas id="my-canvas" width="800" height="450">
    Please use a browser that supports WebGPU.
  </canvas>

  <script id="raytracing-wgsl" type="wgsl">
struct VSOut {
  @builtin(position) position : vec4f,
  @location(0)       coords   : vec2f,
};

struct Uniforms {
  eye            : vec4f,
  right          : vec4f,
  up             : vec4f,
  forward        : vec4f,
  params         : vec4f,
  planePoint     : vec4f,
  planeNormal    : vec4f,
  planeColor     : vec4f,
  meshColor      : vec4f,
  background     : vec4f,
  lightDirection : vec4f,
  lightRadiance  : vec4f,
};

struct Ray {
  origin    : vec3f,
  direction : vec3f,
};

struct HitInfo {
  hit      : bool,
  t        : f32,
  position : vec3f,
  normal   : vec3f,
  diffuse  : vec3f,
};

struct TriHit {
  t     : f32,
  beta  : f32,
  gamma : f32,
};

struct Light {
  Li : vec3f,
  wi : vec3f,
};

@group(0) @binding(0) var<uniform> U : Uniforms;
@group(0) @binding(1) var<storage, read> vPositions : array<vec3f>;
@group(0) @binding(2) var<storage, read> meshFaces  : array<vec3u>;
@group(0) @binding(3) var<storage, read> vNormals   : array<vec3f>;

const PI : f32 = 3.14159265358979;

@vertex
fn vs_main(@builtin(vertex_index) vid: u32) -> VSOut {
  var positions = array<vec2f, 4>(
    vec2f(-1.0, -1.0),
    vec2f( 1.0, -1.0),
    vec2f(-1.0,  1.0),
    vec2f( 1.0,  1.0)
  );
  var out : VSOut;
  out.position = vec4f(positions[vid], 0.0, 1.0);
  out.coords   = positions[vid];
  return out;
}

fn face_forward(n: vec3f, dir: vec3f) -> vec3f {
  let un = normalize(n);
  return select(un, -un, dot(un, dir) > 0.0);
}

fn get_camera_ray(ipcoords: vec2f) -> Ray {
  var ray : Ray;
  ray.origin    = U.eye.xyz;
  ray.direction = normalize(ipcoords.x * U.right.xyz
                          + ipcoords.y * U.up.xyz
                          + U.params.y * U.forward.xyz);
  return ray;
}

fn intersect_plane(ray: Ray, point: vec3f, normal: vec3f) -> f32 {
  let denom = dot(normal, ray.direction);
  if (abs(denom) < 1e-8) { return -1.0; }
  return dot(point - ray.origin, normal) / denom;
}

fn intersect_triangle(ray: Ray, face_index: u32) -> TriHit {
  let f = meshFaces[face_index];
  let v0 = vPositions[f.x];
  let v1 = vPositions[f.y];
  let v2 = vPositions[f.z];
  let edge1 = v1 - v0;
  let edge2 = v2 - v0;
  let pvec = cross(ray.direction, edge2);
  let det = dot(edge1, pvec);
  if (abs(det) < 1e-8) { return TriHit(-1.0, 0.0, 0.0); }
  let inv_det = 1.0 / det;
  let tvec = ray.origin - v0;
  let beta = dot(tvec, pvec) * inv_det;
  let qvec = cross(tvec, edge1);
  let gamma = dot(ray.direction, qvec) * inv_det;
  if (beta < 0.0 || gamma < 0.0 || beta + gamma > 1.0) { return TriHit(-1.0, 0.0, 0.0); }
  return TriHit(dot(edge2, qvec) * inv_det, beta, gamma);
}

fn interpolate_normal(f: vec3u, beta: f32, gamma: f32) -> vec3f {
  let alpha = 1.0 - beta - gamma;
  return normalize(alpha * vNormals[f.x] + beta * vNormals[f.y] + gamma * vNormals[f.z]);
}

fn intersect_scene(ray: Ray) -> HitInfo {
  var hit : HitInfo;
  hit.hit = false;
  hit.t = 1e9;

  let t_plane = intersect_plane(ray, U.planePoint.xyz, U.planeNormal.xyz);
  if (t_plane > 1e-4 && t_plane < hit.t) {
    hit.hit = true;
    hit.t = t_plane;
    hit.position = ray.origin + t_plane * ray.direction;
    hit.normal = face_forward(U.planeNormal.xyz, ray.direction);
    hit.diffuse = U.planeColor.xyz;
  }

  let face_count = u32(U.params.z);
  for (var i = 0u; i < face_count; i = i + 1u) {
    let tri = intersect_triangle(ray, i);
    if (tri.t > 1e-4 && tri.t < hit.t) {
      hit.hit = true;
      hit.t = tri.t;
      hit.position = ray.origin + tri.t * ray.direction;
      hit.normal = face_forward(interpolate_normal(meshFaces[i], tri.beta, tri.gamma), ray.direction);
      hit.diffuse = U.meshColor.xyz;
    }
  }

  return hit;
}

fn is_occluded(origin: vec3f, dir: vec3f) -> bool {
  let ray = Ray(origin, dir);
  if (intersect_plane(ray, U.planePoint.xyz, U.planeNormal.xyz) > 1e-4) { return true; }
  let face_count = u32(U.params.z);
  for (var i = 0u; i < face_count; i = i + 1u) {
    if (intersect_triangle(ray, i).t > 1e-4) { return true; }
  }
  return false;
}

fn sample_directional_light() -> Light {
  return Light(U.lightRadiance.xyz, -normalize(U.lightDirection.xyz));
}

fn shade(hit: HitInfo) -> vec3f {
  let light = sample_directional_light();
  let shadow_origin = hit.position + 1e-3 * hit.normal;
  if (is_occluded(shadow_origin, light.wi)) {
    return vec3f(0.0);
  }
  return hit.diffuse / PI * light.Li * max(dot(hit.normal, light.wi), 0.0);
}

@fragment
fn fs_main(in: VSOut) -> @location(0) vec4f {
  let ipcoords = vec2f(in.coords.x * U.params.x, in.coords.y) * 0.5;
  let ray = get_camera_ray(ipcoords);
  let hit = intersect_scene(ray);
  if (hit.hit) {
    return vec4f(shade(hit), 1.0);
  }
  return vec4f(U.background.xyz, 1.0);
}
  </script>
</body>
