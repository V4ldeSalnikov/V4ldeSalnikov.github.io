<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>W05P5 – Cornell box with an area light</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script defer src="../Week1/MV.js"></script>
  <script defer src="OBJParser.js"></script>
  <script defer src="Worksheet5-5.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #080808; }
    canvas { display: block; margin: auto; }
  </style>
</head>
<body>
  <canvas id="my-canvas" width="512" height="512">
    Please use a browser that supports WebGPU.
  </canvas>

  <script id="raytracing-wgsl" type="wgsl">
struct VSOut {
  @builtin(position) position : vec4f,
  @location(0)       coords   : vec2f,
};

struct Uniforms {
  eye         : vec4f,
  right       : vec4f,
  up          : vec4f,
  forward     : vec4f,
  params      : vec4f,
  lightCenter : vec4f,
  background  : vec4f,
};

struct Material {
  emission : vec3f,
  diffuse  : vec3f,
};

struct Ray {
  origin    : vec3f,
  direction : vec3f,
};

struct HitInfo {
  hit      : bool,
  t        : f32,
  position : vec3f,
  normal   : vec3f,
  diffuse  : vec3f,
  emission : vec3f,
};

struct Light {
  Li   : vec3f,
  wi   : vec3f,
  dist : f32,
};

@group(0) @binding(0) var<uniform> U : Uniforms;
@group(0) @binding(1) var<storage, read> vPositions  : array<vec3f>;
@group(0) @binding(2) var<storage, read> meshFaces   : array<vec3u>;
@group(0) @binding(3) var<storage, read> matIndices  : array<u32>;
@group(0) @binding(4) var<storage, read> materials   : array<Material>;
@group(0) @binding(5) var<storage, read> lightFaces  : array<u32>;

const PI : f32 = 3.14159265358979;

@vertex
fn vs_main(@builtin(vertex_index) vid: u32) -> VSOut {
  var positions = array<vec2f, 4>(
    vec2f(-1.0, -1.0),
    vec2f( 1.0, -1.0),
    vec2f(-1.0,  1.0),
    vec2f( 1.0,  1.0)
  );
  var out : VSOut;
  out.position = vec4f(positions[vid], 0.0, 1.0);
  out.coords   = positions[vid];
  return out;
}

fn face_forward(n: vec3f, dir: vec3f) -> vec3f {
  let un = normalize(n);
  return select(un, -un, dot(un, dir) > 0.0);
}

fn get_camera_ray(ipcoords: vec2f) -> Ray {
  var ray : Ray;
  ray.origin    = U.eye.xyz;
  ray.direction = normalize(ipcoords.x * U.right.xyz
                          + ipcoords.y * U.up.xyz
                          + U.params.y * U.forward.xyz);
  return ray;
}

fn intersect_triangle(ray: Ray, face_index: u32) -> f32 {
  let f = meshFaces[face_index];
  let v0 = vPositions[f.x];
  let v1 = vPositions[f.y];
  let v2 = vPositions[f.z];
  let edge1 = v1 - v0;
  let edge2 = v2 - v0;
  let pvec = cross(ray.direction, edge2);
  let det = dot(edge1, pvec);
  if (abs(det) < 1e-8) { return -1.0; }
  let inv_det = 1.0 / det;
  let tvec = ray.origin - v0;
  let beta = dot(tvec, pvec) * inv_det;
  let qvec = cross(tvec, edge1);
  let gamma = dot(ray.direction, qvec) * inv_det;
  if (beta < 0.0 || gamma < 0.0 || beta + gamma > 1.0) { return -1.0; }
  return dot(edge2, qvec) * inv_det;
}

fn intersect_scene(ray: Ray) -> HitInfo {
  var hit : HitInfo;
  hit.hit = false;
  hit.t = 1e9;

  let face_count = u32(U.params.z);
  for (var i = 0u; i < face_count; i = i + 1u) {
    let t_tri = intersect_triangle(ray, i);
    if (t_tri > 1e-4 && t_tri < hit.t) {
      hit.hit = true;
      hit.t = t_tri;
      hit.position = ray.origin + t_tri * ray.direction;
      let f = meshFaces[i];
      hit.normal = face_forward(cross(vPositions[f.y] - vPositions[f.x], vPositions[f.z] - vPositions[f.x]), ray.direction);
      let mat = materials[matIndices[i]];
      hit.diffuse = mat.diffuse;
      hit.emission = mat.emission;
    }
  }

  return hit;
}

fn is_occluded(origin: vec3f, dir: vec3f, max_dist: f32) -> bool {
  let ray = Ray(origin, dir);
  let face_count = u32(U.params.z);
  for (var i = 0u; i < face_count; i = i + 1u) {
    if (any(materials[matIndices[i]].emission > vec3f(0.0))) { continue; }
    let t = intersect_triangle(ray, i);
    if (t > 1e-3 && t < max_dist) { return true; }
  }
  return false;
}

fn sample_area_light(x: vec3f) -> Light {
  let to_light = U.lightCenter.xyz - x;
  let r = length(to_light);
  let wi = to_light / r;

  var Ie = vec3f(0.0);
  let light_count = u32(U.params.w);
  for (var k = 0u; k < light_count; k = k + 1u) {
    let f = meshFaces[lightFaces[k]];
    let e_cross = cross(vPositions[f.y] - vPositions[f.x], vPositions[f.z] - vPositions[f.x]);
    let ne = normalize(e_cross);
    let area = 0.5 * length(e_cross);
    let cos_e = max(-dot(wi, ne), 0.0);
    Ie += cos_e * materials[matIndices[lightFaces[k]]].emission * area;
  }

  return Light(Ie / (r * r), wi, r);
}

fn shade(hit: HitInfo) -> vec3f {
  if (any(hit.emission > vec3f(0.0))) {
    return hit.emission;
  }
  let light = sample_area_light(hit.position);
  let shadow_origin = hit.position + 1e-3 * hit.normal;
  if (is_occluded(shadow_origin, light.wi, light.dist)) {
    return vec3f(0.0);
  }
  return hit.diffuse / PI * light.Li * max(dot(hit.normal, light.wi), 0.0);
}

@fragment
fn fs_main(in: VSOut) -> @location(0) vec4f {
  let ipcoords = vec2f(in.coords.x * U.params.x, in.coords.y) * 0.5;
  let ray = get_camera_ray(ipcoords);
  let hit = intersect_scene(ray);
  if (hit.hit) {
    return vec4f(shade(hit), 1.0);
  }
  return vec4f(U.background.xyz, 1.0);
}
  </script>
</body>
