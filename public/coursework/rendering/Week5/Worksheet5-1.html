<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>W05P1 – Indexed triangle mesh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script defer src="../Week1/MV.js"></script>
  <script defer src="OBJParser.js"></script>
  <script defer src="Worksheet5-1.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #202020; }
    canvas { display: block; margin: auto; }
  </style>
</head>
<body>
  <canvas id="my-canvas" width="600" height="600">
    Please use a browser that supports WebGPU.
  </canvas>

  <script id="raytracing-wgsl" type="wgsl">
struct VSOut {
  @builtin(position) position : vec4f,
  @location(0)       coords   : vec2f,
};

struct Uniforms {
  eye            : vec4f,
  right          : vec4f,
  up             : vec4f,
  forward        : vec4f,
  params         : vec4f,
  planePoint     : vec4f,
  planeNormal    : vec4f,
  planeAmbient   : vec4f,
  planeDiffuse   : vec4f,
  sphere         : vec4f,
  sphereAmbient  : vec4f,
  sphereDiffuse  : vec4f,
  meshAmbient    : vec4f,
  meshDiffuse    : vec4f,
  background     : vec4f,
  lightPosition  : vec4f,
  lightIntensity : vec4f,
};

struct Ray {
  origin    : vec3f,
  direction : vec3f,
};

struct HitInfo {
  hit      : bool,
  t        : f32,
  position : vec3f,
  normal   : vec3f,
  ambient  : vec3f,
  diffuse  : vec3f,
};

struct Light {
  Li   : vec3f,
  wi   : vec3f,
  dist : f32,
};

@group(0) @binding(0) var<uniform> U : Uniforms;
@group(0) @binding(1) var<storage, read> vPositions : array<vec3f>;
@group(0) @binding(2) var<storage, read> meshFaces  : array<vec3u>;

const PI : f32 = 3.14159265358979;

@vertex
fn vs_main(@builtin(vertex_index) vid: u32) -> VSOut {
  var positions = array<vec2f, 4>(
    vec2f(-1.0, -1.0),
    vec2f( 1.0, -1.0),
    vec2f(-1.0,  1.0),
    vec2f( 1.0,  1.0)
  );
  var out : VSOut;
  out.position = vec4f(positions[vid], 0.0, 1.0);
  out.coords   = positions[vid];
  return out;
}

fn face_forward(n: vec3f, dir: vec3f) -> vec3f {
  let un = normalize(n);
  return select(un, -un, dot(un, dir) > 0.0);
}

fn get_camera_ray(ipcoords: vec2f) -> Ray {
  var ray : Ray;
  ray.origin    = U.eye.xyz;
  ray.direction = normalize(ipcoords.x * U.right.xyz
                          + ipcoords.y * U.up.xyz
                          + U.params.y * U.forward.xyz);
  return ray;
}

fn intersect_plane(ray: Ray, point: vec3f, normal: vec3f) -> f32 {
  let denom = dot(normal, ray.direction);
  if (abs(denom) < 1e-8) { return -1.0; }
  return dot(point - ray.origin, normal) / denom;
}

fn intersect_sphere(ray: Ray, center: vec3f, radius: f32) -> f32 {
  let oc = ray.origin - center;
  let b = dot(oc, ray.direction);
  let c = dot(oc, oc) - radius * radius;
  let disc = b * b - c;
  if (disc < 0.0) { return -1.0; }
  let sqrt_disc = sqrt(disc);
  let t_near = -b - sqrt_disc;
  if (t_near > 1e-4) { return t_near; }
  return -b + sqrt_disc;
}

fn intersect_triangle(ray: Ray, face_index: u32) -> f32 {
  let f = meshFaces[face_index];
  let v0 = vPositions[f.x];
  let v1 = vPositions[f.y];
  let v2 = vPositions[f.z];
  let edge1 = v1 - v0;
  let edge2 = v2 - v0;
  let pvec = cross(ray.direction, edge2);
  let det = dot(edge1, pvec);
  if (abs(det) < 1e-8) { return -1.0; }
  let inv_det = 1.0 / det;
  let tvec = ray.origin - v0;
  let beta = dot(tvec, pvec) * inv_det;
  let qvec = cross(tvec, edge1);
  let gamma = dot(ray.direction, qvec) * inv_det;
  if (beta < 0.0 || gamma < 0.0 || beta + gamma > 1.0) { return -1.0; }
  return dot(edge2, qvec) * inv_det;
}

fn intersect_scene(ray: Ray) -> HitInfo {
  var hit : HitInfo;
  hit.hit = false;
  hit.t = 1e9;

  let t_plane = intersect_plane(ray, U.planePoint.xyz, U.planeNormal.xyz);
  if (t_plane > 1e-4 && t_plane < hit.t) {
    hit.hit = true;
    hit.t = t_plane;
    hit.position = ray.origin + t_plane * ray.direction;
    hit.normal = face_forward(U.planeNormal.xyz, ray.direction);
    hit.ambient = U.planeAmbient.xyz;
    hit.diffuse = U.planeDiffuse.xyz;
  }

  let t_sphere = intersect_sphere(ray, U.sphere.xyz, U.sphere.w);
  if (t_sphere > 1e-4 && t_sphere < hit.t) {
    hit.hit = true;
    hit.t = t_sphere;
    hit.position = ray.origin + t_sphere * ray.direction;
    hit.normal = normalize(hit.position - U.sphere.xyz);
    hit.ambient = U.sphereAmbient.xyz;
    hit.diffuse = U.sphereDiffuse.xyz;
  }

  let face_count = u32(U.params.z);
  for (var i = 0u; i < face_count; i = i + 1u) {
    let t_tri = intersect_triangle(ray, i);
    if (t_tri > 1e-4 && t_tri < hit.t) {
      hit.hit = true;
      hit.t = t_tri;
      hit.position = ray.origin + t_tri * ray.direction;
      let f = meshFaces[i];
      hit.normal = face_forward(cross(vPositions[f.y] - vPositions[f.x], vPositions[f.z] - vPositions[f.x]), ray.direction);
      hit.ambient = U.meshAmbient.xyz;
      hit.diffuse = U.meshDiffuse.xyz;
    }
  }

  return hit;
}

fn is_occluded(origin: vec3f, dir: vec3f, max_dist: f32) -> bool {
  let ray = Ray(origin, dir);
  let t_plane = intersect_plane(ray, U.planePoint.xyz, U.planeNormal.xyz);
  if (t_plane > 1e-4 && t_plane < max_dist) { return true; }
  let t_sphere = intersect_sphere(ray, U.sphere.xyz, U.sphere.w);
  if (t_sphere > 1e-4 && t_sphere < max_dist) { return true; }
  let face_count = u32(U.params.z);
  for (var i = 0u; i < face_count; i = i + 1u) {
    let t_tri = intersect_triangle(ray, i);
    if (t_tri > 1e-4 && t_tri < max_dist) { return true; }
  }
  return false;
}

fn sample_point_light(pos: vec3f) -> Light {
  let to_light = U.lightPosition.xyz - pos;
  let dist = length(to_light);
  return Light(U.lightIntensity.xyz / (dist * dist), to_light / dist, dist);
}

fn shade(hit: HitInfo) -> vec3f {
  var Lo = hit.ambient;
  let light = sample_point_light(hit.position);
  let shadow_origin = hit.position + 1e-3 * hit.normal;
  if (!is_occluded(shadow_origin, light.wi, light.dist)) {
    Lo += hit.diffuse / PI * light.Li * max(dot(hit.normal, light.wi), 0.0);
  }
  return Lo;
}

@fragment
fn fs_main(in: VSOut) -> @location(0) vec4f {
  let ipcoords = vec2f(in.coords.x * U.params.x, in.coords.y) * 0.5;
  let ray = get_camera_ray(ipcoords);
  let hit = intersect_scene(ray);
  if (hit.hit) {
    return vec4f(shade(hit), 1.0);
  }
  return vec4f(U.background.xyz, 1.0);
}
  </script>
</body>
