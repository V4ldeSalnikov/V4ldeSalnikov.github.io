  <style>

    label { display: flex; align-items: center; gap: 6px; }

<body>
  <div id="toolbar">
    <label>Object
      <select id="scene-select">
        <option value="bunny" selected>Bunny</option>
        <option value="teapot">Teapot</option>
      </select>
    </label>
    <label>Shading
      <select id="shading-select">
        <option value="base">Base colour</option>
        <option value="mirror">Mirror</option>
        <option value="diffuse" selected>Diffuse</option>
      </select>
    </label>
    <span id="gpu-time">GPU frame: waiting...</span>
    <span id="frame-count">Samples: 0</span>
    <label><input id="progressive-toggle" type="checkbox" checked /> Progressive</label>
    <label><input id="holdout-toggle" type="checkbox" checked /> Holdout plane</label>
    <button id="render-button" type="button">Reset</button>
  </div>

  <canvas id="my-canvas" width="800" height="450">
    Please use a browser that supports WebGPU.
  </canvas>

  <script id="raytracing-wgsl" type="wgsl">
struct VSOut {
  @builtin(position) position : vec4f,
  @location(0)       coords   : vec2f,
};

struct FSOut {
  @location(0) frame : vec4f,
  @location(1) accum : vec4f,
};

struct Uniforms {
  eye         : vec4f,
  right       : vec4f,
  up          : vec4f,
  forward     : vec4f,
  params      : vec4f,
  extra       : vec4f,
  baseColor   : vec4f,
  plane       : vec4f,
  planeNormal : vec4f,
};

struct VertexAttrib { position : vec3f, normal : vec3f };
struct Aabb         { min : vec3f, max : vec3f };

struct Ray    { origin : vec3f, direction : vec3f, tmin : f32, tmax : f32 };
struct HitInfo { hit : bool, t : f32, position : vec3f, normal : vec3f, holdout : bool };
struct TriHit  { t : f32, beta : f32, gamma : f32 };

@group(0) @binding(0) var<uniform> U : Uniforms;
@group(0) @binding(1) var<storage, read> attribs   : array<VertexAttrib>;
@group(0) @binding(2) var<storage, read> meshFaces : array<vec4u>;
@group(0) @binding(3) var<uniform> aabb : Aabb;
@group(0) @binding(4) var<storage, read> treeIds   : array<u32>;
@group(0) @binding(5) var<storage, read> bspTree   : array<vec4u>;
@group(0) @binding(6) var<storage, read> bspPlanes : array<f32>;
@group(0) @binding(7) var envTexture : texture_2d<f32>;
@group(0) @binding(8) var envSampler : sampler;
@group(0) @binding(9) var previousFrame : texture_2d<f32>;

const PI : f32 = 3.14159265358979;
const MAX_LEVEL : u32 = 20u;
const BSP_LEAF  : u32 = 3u;
const INTERVAL_EPS : f32 = 1e-6;
const HOLDOUT_SAMPLES : u32 = 8u;

const SHADING_BASE    : u32 = 0u;
const SHADING_MIRROR  : u32 = 1u;
const SHADING_DIFFUSE : u32 = 2u;

fn tea(val0: u32, val1: u32) -> u32 {
  const N = 16u;
  var v0 = val0; var v1 = val1; var s0 = 0u;
  for (var n = 0u; n < N; n = n + 1u) {
    s0 += 0x9e3779b9u;
    v0 += ((v1 << 4u) + 0xa341316cu) ^ (v1 + s0) ^ ((v1 >> 5u) + 0xc8013ea4u);
    v1 += ((v0 << 4u) + 0xad90777du) ^ (v0 + s0) ^ ((v0 >> 5u) + 0x7e95761eu);
  }
  return v0;
}

fn mcg31(prev: ptr<function, u32>) -> u32 {
  const LCG_A = 1977654935u;
  *prev = (LCG_A * (*prev)) & 0x7FFFFFFFu;
  return *prev;
}

fn rnd(prev: ptr<function, u32>) -> f32 {
  return f32(mcg31(prev)) / f32(0x80000000u);
}

fn spherical_direction(sin_theta: f32, cos_theta: f32, phi: f32) -> vec3f {
  return vec3f(sin_theta * cos(phi), sin_theta * sin(phi), cos_theta);
}

fn rotate_to_normal(n: vec3f, v: vec3f) -> vec3f {
  let s = sign(n.z + 1e-16);
  let a = -1.0 / (1.0 + abs(n.z));
  let b = n.x * n.y * a;
  return vec3f(1.0 + n.x * n.x * a, b, -s * n.x) * v.x
       + vec3f(s * b, s * (1.0 + n.y * n.y * a), -n.y) * v.y
       + n * v.z;
}

fn cosine_hemisphere(n: vec3f, seed: ptr<function, u32>) -> vec3f {
  let xi1 = rnd(seed);
  let xi2 = rnd(seed);
  let cos_theta = sqrt(1.0 - xi1);
  let sin_theta = sqrt(xi1);
  return rotate_to_normal(n, spherical_direction(sin_theta, cos_theta, 2.0 * PI * xi2));
}

fn env_uv(direction: vec3f) -> vec2f {
  let d = normalize(direction);
  let u = 0.5 + atan2(d.x, -d.z) / (2.0 * PI);
  let v = acos(clamp(d.y, -1.0, 1.0)) / PI;
  return vec2f(u, v);
}

fn sample_environment(direction: vec3f) -> vec3f {
  let texel = textureSampleLevel(envTexture, envSampler, env_uv(direction), 0.0);
  return texel.rgb * exp2(texel.a * 255.0 - 128.0);
}

fn tone_map(color: vec3f) -> vec3f {
  return pow(max(color * U.extra.w, vec3f(0.0)), vec3f(1.0 / 2.2));
}

@vertex
fn vs_main(@builtin(vertex_index) vid: u32) -> VSOut {
  var positions = array<vec2f, 4>(
    vec2f(-1.0, -1.0),
    vec2f( 1.0, -1.0),
    vec2f(-1.0,  1.0),
    vec2f( 1.0,  1.0)
  );
  var out : VSOut;
  out.position = vec4f(positions[vid], 0.0, 1.0);
  out.coords   = positions[vid];
  return out;
}

fn face_forward(n: vec3f, dir: vec3f) -> vec3f {
  let un = normalize(n);
  return select(un, -un, dot(un, dir) > 0.0);
}

fn get_camera_ray(ipcoords: vec2f) -> Ray {
  let dir = normalize(ipcoords.x * U.right.xyz + ipcoords.y * U.up.xyz + U.params.y * U.forward.xyz);
  return Ray(U.eye.xyz, dir, 1e-3, 1e9);
}

fn intersect_min_max(r: ptr<function, Ray>) -> bool {
  let p1 = (aabb.min - (*r).origin) / (*r).direction;
  let p2 = (aabb.max - (*r).origin) / (*r).direction;
  let pmin = min(p1, p2);
  let pmax = max(p1, p2);
  let tmin = max(pmin.x, max(pmin.y, pmin.z)) - 1e-5;
  let tmax = min(pmax.x, min(pmax.y, pmax.z)) + 1e-5;
  if (tmin > tmax || tmin > (*r).tmax || tmax < (*r).tmin) { return false; }
  (*r).tmin = max(tmin, (*r).tmin);
  (*r).tmax = min(tmax, (*r).tmax);
  return true;
}

fn intersect_triangle(ray: Ray, face_index: u32) -> TriHit {
  let f = meshFaces[face_index];
  let v0 = attribs[f.x].position;
  let v1 = attribs[f.y].position;
  let v2 = attribs[f.z].position;
  let edge1 = v1 - v0;
  let edge2 = v2 - v0;
  let pvec = cross(ray.direction, edge2);
  let det = dot(edge1, pvec);
  if (abs(det) < 1e-12) { return TriHit(-1.0, 0.0, 0.0); }
  let inv_det = 1.0 / det;
  let tvec = ray.origin - v0;
  let beta = dot(tvec, pvec) * inv_det;
  let qvec = cross(tvec, edge1);
  let gamma = dot(ray.direction, qvec) * inv_det;
  if (beta < 0.0 || gamma < 0.0 || beta + gamma > 1.0) { return TriHit(-1.0, 0.0, 0.0); }
  let t = dot(edge2, qvec) * inv_det;
  if (t > ray.tmin - INTERVAL_EPS && t < ray.tmax + INTERVAL_EPS) { return TriHit(t, beta, gamma); }
  return TriHit(-1.0, 0.0, 0.0);
}

fn interpolate_normal(f: vec4u, beta: f32, gamma: f32) -> vec3f {
  let alpha = 1.0 - beta - gamma;
  return normalize(alpha * attribs[f.x].normal + beta * attribs[f.y].normal + gamma * attribs[f.z].normal);
}

fn make_mesh_hit(ray: Ray, tri: TriHit, face_index: u32) -> HitInfo {
  let f = meshFaces[face_index];
  var hit : HitInfo;
  hit.hit = true;
  hit.t = tri.t;
  hit.position = ray.origin + tri.t * ray.direction;
  hit.normal = face_forward(interpolate_normal(f, tri.beta, tri.gamma), ray.direction);
  hit.holdout = false;
  return hit;
}

fn intersect_trimesh(ray_in: Ray) -> HitInfo {
  var ray = ray_in;
  var hit : HitInfo;
  hit.hit = false;
  hit.t = ray.tmax;
  if (!intersect_min_max(&ray)) { return hit; }

  var branch_node : array<vec2u, MAX_LEVEL>;
  var branch_ray  : array<vec2f, MAX_LEVEL>;
  var branch_lvl = 0u;
  var node = 0u;

  for (var i = 0u; i <= MAX_LEVEL; i = i + 1u) {
    let tree_node = bspTree[node];
    let axis_leaf = tree_node.x & 3u;
    if (axis_leaf == BSP_LEAF) {
      let count = tree_node.x >> 2u;
      let id = tree_node.y;
      var found = false;
      for (var j = 0u; j < count; j = j + 1u) {
        let face_index = treeIds[id + j];
        let tri = intersect_triangle(ray, face_index);
        if (tri.t > 0.0) { hit = make_mesh_hit(ray, tri, face_index); ray.tmax = tri.t; found = true; }
      }
      if (found) { return hit; }
      if (branch_lvl == 0u) { return hit; }
      branch_lvl = branch_lvl - 1u;
      i = branch_node[branch_lvl].x;
      node = branch_node[branch_lvl].y;
      ray.tmin = branch_ray[branch_lvl].x;
      ray.tmax = branch_ray[branch_lvl].y;
      continue;
    }
    let axis = axis_leaf;
    let dir_axis = ray.direction[axis];
    var near_node = tree_node.z;
    var far_node = tree_node.w;
    if (dir_axis < 0.0) { near_node = tree_node.w; far_node = tree_node.z; }
    let denom = select(dir_axis, 1e-8, abs(dir_axis) < 1e-8);
    let t = (bspPlanes[node] - ray.origin[axis]) / denom;
    if (t > ray.tmax) {
      node = near_node;
    } else if (t < ray.tmin) {
      node = far_node;
    } else {
      branch_node[branch_lvl] = vec2u(i, far_node);
      branch_ray[branch_lvl] = vec2f(t, ray.tmax);
      branch_lvl = branch_lvl + 1u;
      ray.tmax = t;
      node = near_node;
    }
  }
  return hit;
}

fn intersect_plane(ray: Ray) -> HitInfo {
  var hit : HitInfo;
  hit.hit = false;
  let n = normalize(U.planeNormal.xyz);
  let denom = dot(n, ray.direction);
  if (abs(denom) < 1e-6) { return hit; }
  let t = dot(U.plane.xyz - ray.origin, n) / denom;
  if (t < ray.tmin || t > ray.tmax) { return hit; }
  hit.hit = true;
  hit.t = t;
  hit.position = ray.origin + t * ray.direction;
  hit.normal = face_forward(n, ray.direction);
  hit.holdout = true;
  return hit;
}

fn intersect_scene(ray: Ray) -> HitInfo {
  var hit = intersect_trimesh(ray);
  if (U.plane.w > 0.5) {
    var plane_ray = ray;
    plane_ray.tmax = select(ray.tmax, hit.t, hit.hit);
    let plane_hit = intersect_plane(plane_ray);
    if (plane_hit.hit) { hit = plane_hit; }
  }
  return hit;
}

fn shade_holdout(ray: Ray, hit: HitInfo, seed: ptr<function, u32>) -> vec3f {
  let origin = hit.position + 1e-4 * hit.normal;
  var visibility = 0.0;
  for (var i = 0u; i < HOLDOUT_SAMPLES; i = i + 1u) {
    let wi = cosine_hemisphere(hit.normal, seed);
    if (!intersect_trimesh(Ray(origin, wi, 1e-4, 1e9)).hit) { visibility += 1.0; }
  }
  let ao = visibility / f32(HOLDOUT_SAMPLES);
  return sample_environment(ray.direction) * ao;
}

fn trace_ray(ray: Ray, seed: ptr<function, u32>) -> vec3f {
  let hit = intersect_scene(ray);
  if (!hit.hit) {
    return sample_environment(ray.direction);
  }
  if (hit.holdout) {
    return shade_holdout(ray, hit, seed);
  }
  let mode = u32(U.extra.x);
  if (mode == SHADING_BASE) {
    return U.baseColor.xyz;
  }
  if (mode == SHADING_MIRROR) {
    return sample_environment(reflect(ray.direction, hit.normal));
  }
  let wi = cosine_hemisphere(hit.normal, seed);
  return U.baseColor.xyz * sample_environment(wi);
}

@fragment
fn fs_main(in: VSOut) -> FSOut {
  let pixel = vec2u(in.position.xy);
  let width = U.extra.y;
  let height = U.extra.z;
  let frame = u32(U.params.z);
  let progressive = U.params.w > 0.5;

  var seed = tea(pixel.y * u32(width) + pixel.x, frame);
  let aspect = U.params.x;
  var ipcoords = vec2f(in.coords.x * aspect, in.coords.y) * 0.5;
  if (progressive) {
    ipcoords += vec2f((rnd(&seed) - 0.5) * aspect / width, (rnd(&seed) - 0.5) / height);
  }

  let sample_color = trace_ray(get_camera_ray(ipcoords), &seed);

  let previous = textureLoad(previousFrame, pixel, 0).rgb;
  var color = sample_color;
  if (progressive && frame > 0u) {
    color = (previous * f32(frame) + sample_color) / f32(frame + 1u);
  }

  var out : FSOut;
  out.frame = vec4f(tone_map(color), 1.0);
  out.accum = vec4f(color, 1.0);
  return out;
}
  </script>
