<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>W01P1c – Rays from a pinhole camera</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script defer src="MV.js"></script>
  <script defer src="Worksheet1-1c.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #222; }
    canvas { display: block; margin: auto; }
  </style>
</head>
<body>
  <canvas id="my-canvas" width="512" height="512"></canvas>

  <script id="ray-wgsl" type="wgsl">
    struct VSOut {
      @builtin(position) position : vec4f,
      @location(0)       coords   : vec2f,
    };

    @vertex
    fn vs_main(@builtin(vertex_index) vid: u32) -> VSOut {
      var positions = array<vec2f, 4>(
        vec2f(-1.0, -1.0),
        vec2f( 1.0, -1.0),
        vec2f(-1.0,  1.0),
        vec2f( 1.0,  1.0)
      );
      var out : VSOut;
      out.position = vec4f(positions[vid], 0.0, 1.0);
      out.coords   = positions[vid];
      return out;
    }

    struct Ray {
      origin    : vec3f,
      direction : vec3f,
    };

    const eye       = vec3f(2.0, 1.5, 2.0);
    const look_at   = vec3f(0.0, 0.5, 0.0);
    const up_vec    = vec3f(0.0, 1.0, 0.0);
    const cam_const = 1.0;

    fn get_camera_ray(ipcoords: vec2f) -> Ray {
      let v  = normalize(look_at - eye);
      let b1 = normalize(cross(v, up_vec));
      let b2 = cross(b1, v);

      var ray : Ray;
      ray.origin    = eye;
      ray.direction = normalize(ipcoords.x * b1 + ipcoords.y * b2 + cam_const * v);
      return ray;
    }

    @fragment
    fn fs_main(in: VSOut) -> @location(0) vec4f {
      let ipcoords = in.coords * 0.5;
      let r = get_camera_ray(ipcoords);
      return vec4f(r.direction * 0.5 + 0.5, 1.0);
    }
  </script>
</body>
</html>
